# Defaults. Every value can be overridden with -Dkey=value or an environment
# variable (BASE_URL, BROWSER, HEADLESS, GRID_URL, ...).

base.url=https://www.saucedemo.com
browser=chrome
headless=true

# local | grid  — grid sends sessions to grid.url instead of launching locally
execution.mode=local
grid.url=http://localhost:4444/wd/hub

# All waits in the framework are explicit; no implicit wait is configured.
wait.seconds=15
pageload.seconds=30

# Published on the demo application's own sign-in page; not a secret.
user.password=secret_sauce
